name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # No dependencies by design, so there is nothing to install.
      # The glob is deliberately unquoted so the shell expands it into explicit
      # paths: `node --test` only learned to expand globs itself in Node 22, and a
      # quoted pattern is passed through verbatim and not found on older runtimes.
      - name: Unit tests
        run: node --test tests/*.test.js

  smoke:
    name: the gate against this commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # write, so the watch-mode step can publish gate-smoke
      statuses: write # for the publish: status leg
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Exercises the real GraphQL path, pagination, skip logic and reporting
      # against live check-run data. dry-run keeps it from gating this repo's own
      # PRs, and a low attempt limit keeps it from waiting on the slow jobs.
      - name: Run the gate in dry-run
        uses: ./
        with:
          mode: wait
          dry-run: 'true'
          warmup-delay: PT5S
          minimum-interval: PT5S
          attempt-limits: '3'

      # Watch mode for real, not dry-run: the check-run write is the one path unit
      # tests can only reach through a stubbed fetch, so a live POST against the API
      # is the point of this step. `gate-smoke` is required by no ruleset, so
      # publishing it gates nothing.
      - name: Run the gate in watch mode, creating the check run
        uses: ./
        with:
          mode: watch
          warmup-delay: PT5S
          check-name: gate-smoke

      # A second run is how every event after the first behaves: find the check run
      # this action owns by external_id and update it. That lookup is the part that
      # can hijack another tool's check or duplicate the required status context, so
      # it is worth proving against the real API and not only a stub.
      - name: Run the gate in watch mode again, updating the same check run
        uses: ./
        with:
          mode: watch
          warmup-delay: '0'
          check-name: gate-smoke

      # One check run of that name, or the required status context would flip
      # between duplicates depending on which was written last.
      #
      # Then close it out. The verdict here is a test artifact about whichever
      # siblings happened to be running, and leaving it in_progress would park a
      # permanently pending check on every PR in this repo.
      - name: Assert the second run updated rather than duplicated, then close it
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          owned=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?check_name=gate-smoke&filter=all&per_page=100" \
            --jq '[.check_runs[] | select(.external_id == "muratkeremozcan/pr-gate:gate-smoke")]')
          count=$(echo "${owned}" | jq 'length')
          echo "gate-smoke check runs owned by pr-gate: ${count}"
          test "${count}" -eq 1

          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/check-runs/$(echo "${owned}" | jq '.[0].id')" \
            -f status=completed -f conclusion=neutral \
            -f 'output[title]=smoke test artifact, not a verdict' \
            -f 'output[summary]=Created and updated by the pr-gate smoke test to exercise the check-run write path. Says nothing about this PR.' \
            --silent

      # publish: status goes through a different endpoint with different
      # permissions, so the stub in the unit tests says nothing about whether the
      # real POST is accepted. `gate-smoke-status` is required by no ruleset.
      - name: Run the gate in watch mode, publishing a commit status
        uses: ./
        with:
          mode: watch
          publish: status
          warmup-delay: PT5S
          check-name: gate-smoke-status

      # A commit status is not a check run: it has no id and no ownership, so a
      # second run supersedes rather than duplicating. Worth proving live, because
      # that property is the reason the status write needs no lost-response guard.
      - name: Run it again, then assert one context carrying the latest state
        uses: ./
        with:
          mode: watch
          publish: status
          warmup-delay: '0'
          check-name: gate-smoke-status

      - name: Assert the status exists, names its jobs, and links to this run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          combined=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/status" \
            --jq '[.statuses[] | select(.context == "gate-smoke-status")]')
          echo "${combined}" | jq .

          # The combined endpoint reports one entry per context, the latest one,
          # so two runs must still leave exactly one required context behind.
          test "$(echo "${combined}" | jq 'length')" -eq 1

          # 140 is the endpoint's cap. Asserted live because exceeding it is the
          # one way this write can be rejected and lose a verdict.
          desc=$(echo "${combined}" | jq -r '.[0].description')
          echo "description (${#desc} chars): ${desc}"
          test "${#desc}" -le 140

          echo "${combined}" | jq -r '.[0].target_url' | grep -q "actions/runs/${GITHUB_RUN_ID}"

      # wait-for is the one input whose whole point is a check run that is NOT
      # there, so a stub can only prove the arithmetic. Run against this commit's
      # live check runs with a rule that can never match: first that it holds the
      # gate open rather than concluding green, then that the deadline turns it
      # into a failure naming the job. A gate that concluded green here would be
      # the exact bug, and it would be invisible.
      - name: Assert wait-for holds a gate that would otherwise pass, then times out
        env:
          TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RULE: '[{"workflowFile":"no-such-workflow.yml"}]'
        run: |
          set -o pipefail
          # Every input is spelled out because this runs main.js directly rather
          # than through `uses:`, and the runner only applies action.yml defaults
          # to an action it resolved. Left implicit, skip-same-workflow reads as
          # false, the gate watches the job it is running in, and the run never
          # concludes.
          common() {
            env INPUT_MODE=wait "INPUT_GITHUB-TOKEN=$TOKEN" INPUT_REF="$SHA" \
                INPUT_DRY-RUN=true INPUT_ATTEMPT-LIMITS=1 INPUT_WARMUP-DELAY=0 \
                INPUT_SKIP-SAME-WORKFLOW=true INPUT_EARLY-EXIT=true \
                INPUT_WAIT-FOR="$RULE" "$@" node main.js
          }

          # Inside the timeout: pending, so the gate cannot conclude without it.
          common INPUT_WAIT-FOR-TIMEOUT=P30D | tee within.txt
          grep -q 'no-such-workflow.yml / (any job): not started yet' within.txt
          grep -q 'still running' within.txt

          # Past it: a failure that says which job never came.
          common INPUT_WAIT-FOR-TIMEOUT=PT1S | tee expired.txt
          grep -q 'no-such-workflow.yml / (any job): never started' expired.txt

          # And the lenient reading of the same input lets the commit through.
          common INPUT_WAIT-FOR-TIMEOUT=PT1S INPUT_WAIT-FOR-TIMEOUT-CONCLUSION=success | tee waived.txt
          grep -q 'was let through by wait-for-timeout-conclusion: success' waived.txt

      # The bypass is what a hotfix relies on while something is on fire, and it is
      # the one path where publishing a pass is the correct behaviour. Worth proving
      # live: a bypass that quietly fails to publish blocks the merge it exists to
      # unblock. The prefix is the whole branch name, so it matches on both a PR and
      # the push to main.
      - name: Run the gate with this branch bypassed
        uses: ./
        with:
          mode: watch
          check-name: gate-smoke-bypass
          bypass-branch-prefixes: ${{ github.head_ref || github.ref_name }}

      - name: Assert the bypass published a pass that admits it checked nothing
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          owned=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?check_name=gate-smoke-bypass&filter=all&per_page=100" \
            --jq '[.check_runs[] | select(.external_id == "muratkeremozcan/pr-gate:gate-smoke-bypass")]')
          test "$(echo "${owned}" | jq 'length')" -eq 1
          test "$(echo "${owned}" | jq -r '.[0].conclusion')" = "success"
          echo "${owned}" | jq -r '.[0].output.summary' | grep -q 'did not check anything'
