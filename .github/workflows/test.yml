name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # No dependencies by design, so there is nothing to install.
      # The glob is deliberately unquoted so the shell expands it into explicit
      # paths: `node --test` only learned to expand globs itself in Node 22, and a
      # quoted pattern is passed through verbatim and not found on older runtimes.
      - name: Unit tests
        run: node --test tests/*.test.js

  smoke:
    name: the gate against this commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      statuses: write # so the watch-mode steps can publish their verdict
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Exercises the real GraphQL path, pagination, skip logic and reporting
      # against live check-run data. dry-run keeps it from gating this repo's own
      # PRs, and a low attempt limit keeps it from waiting on the slow jobs.
      - name: Run the gate in dry-run
        uses: ./
        with:
          mode: wait
          dry-run: 'true'
          warmup-delay: PT5S
          minimum-interval: PT5S
          attempt-limits: '3'

      # Watch mode for real, not dry-run: the status write is the one path unit
      # tests can only reach through a stubbed fetch, so a live POST against the API
      # is the point of this step. `gate-smoke-status` is required by no ruleset, so
      # publishing it gates nothing.
      - name: Run the gate in watch mode, publishing a commit status
        uses: ./
        with:
          mode: watch
          warmup-delay: PT5S
          check-name: gate-smoke-status

      # A commit status has no id and no ownership, so a second run supersedes
      # rather than duplicating. Worth proving live, because that property is the
      # reason the write needs no lost-response guard.
      - name: Run it again, then assert one context carrying the latest state
        uses: ./
        with:
          mode: watch
          warmup-delay: '0'
          check-name: gate-smoke-status

      - name: Assert the status exists, names its jobs, and links to this run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          combined=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/status" \
            --jq '[.statuses[] | select(.context == "gate-smoke-status")]')
          echo "${combined}" | jq .

          # The combined endpoint reports one entry per context, the latest one,
          # so two runs must still leave exactly one required context behind.
          test "$(echo "${combined}" | jq 'length')" -eq 1

          # 140 is the endpoint's cap. Asserted live because exceeding it is the
          # one way this write can be rejected and lose a verdict.
          desc=$(echo "${combined}" | jq -r '.[0].description')
          echo "description (${#desc} chars): ${desc}"
          test "${#desc}" -le 140

          echo "${combined}" | jq -r '.[0].target_url' | grep -q "actions/runs/${GITHUB_RUN_ID}"

      # The bypass is what a hotfix relies on while something is on fire, and it is
      # the one path where publishing a pass is the correct behaviour. Worth proving
      # live: a bypass that quietly fails to publish blocks the merge it exists to
      # unblock. The prefix is the whole branch name, so it matches on both a PR and
      # the push to main.
      - name: Run the gate with this branch bypassed
        uses: ./
        with:
          mode: watch
          check-name: gate-smoke-bypass
          bypass-branch-prefixes: ${{ github.head_ref || github.ref_name }}

      - name: Assert the bypass published a pass that admits it checked nothing
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          bypass=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/status" \
            --jq '[.statuses[] | select(.context == "gate-smoke-bypass")]')
          echo "${bypass}" | jq .
          test "$(echo "${bypass}" | jq 'length')" -eq 1
          test "$(echo "${bypass}" | jq -r '.[0].state')" = "success"
          echo "${bypass}" | jq -r '.[0].description' | grep -q 'nothing was checked'
